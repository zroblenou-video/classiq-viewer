<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #191919; color: #ccc; font-family: 'Courier New', monospace; overflow: hidden; }
  canvas { display: block; }

  .hud {
    position: fixed; z-index: 10;
    background: rgba(25,25,25,0.88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 10px 14px; font-size: 12px;
  }
  #info { top: 48px; left: 14px; max-width: 320px; }
  #brand { position: fixed; top: 16px; left: 16px; z-index: 10; pointer-events: none; }
  #brand .brand-logo { height: 20px; width: auto; display: block; }
  #info .title { color: #119DA4; font-size: 11px; margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  #info .row { color: #999; margin: 3px 0; }
  #info .row span { color: #ccc; }

  #legend { bottom: 14px; left: 14px; min-width: 190px; }
  #legend-logical { bottom: 14px; left: 14px; min-width: 190px; max-height: 46vh; overflow-y: auto; }
  #legend .title, #legend-logical .title { color: #119DA4; font-size: 11px; margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
  .leg { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
  .leg-sw { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid #333; }
  .leg-lbl { color: #aaa; font-size: 12px; }

  #hint { bottom: 14px; right: 14px; color: #666; line-height: 1.9; font-size: 11px; text-align: right; }

  #viewtoggle { top: 14px; right: 14px; display: flex; gap: 6px; padding: 6px; }
  #camctrl { top: 62px; right: 14px; display: flex; gap: 6px; padding: 6px; }
  .vbtn {
    background: #222; color: #aaa; border: 1px solid #333; border-radius: 6px;
    padding: 6px 10px; font-family: inherit; font-size: 11px; cursor: pointer;
  }
  .vbtn:hover { color: #ccc; border-color: #444; }
  .vbtn.active { background: #119DA4; color: #fff; border-color: #119DA4; }

  #tooltip {
    position: fixed; z-index: 20; display: none; pointer-events: none;
    background: rgba(25,25,25,0.92);
    border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: #ccc; white-space: nowrap;
  }
</style>
</head>

</div>

<div class="hud" id="legend-logical" style="display:none">

</div>

<div class="hud" id="viewtoggle">

</div>

<div class="hud" id="camctrl">

  <button id="btn-layout" class="vbtn">View layout grid</button>
</div>

<div class="hud" id="hint">

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const program = JSON.parse(document.getElementById('program-data').textContent);

// Cubes sit one lattice unit apart; spread them out so the connecting pipes
// have room to read as distinct segments rather than touching faces.
const SPACING = 1.68;

// Coordinate mapping: lattice (x, y, z) -> three.js (x, z, y). z is time and
// becomes the vertical axis so the circuit reads bottom-to-top. Positions are
// scaled by SPACING so pipes are long and clearly visible.
function toVec(x, y, z) { return new THREE.Vector3(x * SPACING, z * SPACING, y * SPACING); }

const X_COLOR = new THREE.Color(0xF43764);
const Z_COLOR = new THREE.Color(0x119DA4);
const Y_COLOR = new THREE.Color(0xD7F75B);
const T_COLOR = new THREE.Color(0x9170C6);
const PIPE_COLOR = new THREE.Color(0x666666);
const EDGE_COLOR = new THREE.Color(0x111111);

const CUBE_SIZE = 0.7;
const EDGE_CUBE_LIMIT = 5000;  // draw edge outlines only when the scene is small

function faceColorsFromKind(kind) {
  // BoxGeometry material array order is [+x, -x, +y, -y, +z, -z] in THREE
  // axes. Our toVec swaps lattice y and z (lattice z is drawn vertical),
  // so lattice axis 1 maps to THREE +z/-z and lattice axis 2 to THREE +y/-y.
  // A Kind like "ZXZ" means lattice axis-0='Z', axis-1='X', axis-2='Z'.
  if (kind === 'Y') return [Y_COLOR, Y_COLOR, Y_COLOR, Y_COLOR, Y_COLOR, Y_COLOR];
  if (kind === 'T') return [T_COLOR, T_COLOR, T_COLOR, T_COLOR, T_COLOR, T_COLOR];
  const axisColors = [...kind].map(ch => (ch === 'X' ? X_COLOR : Z_COLOR));
  return [
    axisColors[0], axisColors[0],  // THREE +x/-x <- lattice x
    axisColors[2], axisColors[2],  // THREE +y/-y <- lattice z (vertical)
    axisColors[1], axisColors[1],  // THREE +z/-z <- lattice y

// Cache one material array per (kind, touched-face set). Faces that a pipe
// attaches to are drawn at half opacity -- but only red (X) and blue (Z)

// of BoxGeometry face indices, or undefined for cubes with no pipes.
const cubeMatCache = {};

  const key = kind + '|' + (touched ? [...touched].sort((a, b) => a - b).join(',') : '');
  let mats = cubeMatCache[key];
  if (mats) return mats;
  mats = faceColorsFromKind(kind).map((c, i) => {
    const seeThrough = touched && touched.has(i) && (c === X_COLOR || c === Z_COLOR);

      ? new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: 0.5 })
      : new THREE.MeshLambertMaterial({ color: c });

// and its inverse share a colour (t/tdg, s/sdg).

  if (gt === 't' || gt === 'tdg') return 't';
  if (gt === 's' || gt === 'sdg') return 's';
  return gt;
}
const gateTypeColor = {};
{
  const keys = [...new Set(program.cubes.map(c => colorKey(c.gate_type)))].sort();
  keys.forEach((k, i) => {
    gateTypeColor[k] = new THREE.Color().setHSL(i / Math.max(keys.length, 1), 0.58, 0.58);
  });
}

function logicalCubeMaterial(gt) {
  const k = colorKey(gt);
  let mat = logicalCubeMatByKey[k];
  if (!mat) {
    const color = gateTypeColor[k] || new THREE.Color(0x888888);
    mat = logicalCubeMatByKey[k] = new THREE.MeshLambertMaterial({ color });
  }

}

// Scene setup.
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(2, 4, 3);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xaabbcc, 0.30);
fill.position.set(-2, -1, -1);
scene.add(fill);

// Track bbox with scalar min/max -- Math.max(...arr) overflows the arg limit
// on very large routed programs.
let minX = Infinity, minY = Infinity, minZ = Infinity;
let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

const cubeGeom = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
const edgeGeom = new THREE.EdgesGeometry(cubeGeom);
// Y cubes are drawn half as tall (the vertical/time axis is three.js y).
const yCubeGeom = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE / 2, CUBE_SIZE);
const yEdgeGeom = new THREE.EdgesGeometry(yCubeGeom);
const edgeMaterial = new THREE.LineBasicMaterial({ color: EDGE_COLOR });
const drawEdges = program.cubes.length <= EDGE_CUBE_LIMIT;

// A pipe attaches to one face of each cube it meets; collect those faces per
// cell so the cube can render them half-transparent. BoxGeometry face order is
// [+x,-x,+y,-y,+z,-z]; lattice x->three.js x, y->z, z->y (vertical).
const FACE_PLUS = [0, 4, 2];
const FACE_MINUS = [1, 5, 3];
const touchedFaces = {};
for (const pipe of program.pipes) {
  const d = pipe.src[0] !== pipe.dst[0] ? 0 : (pipe.src[1] !== pipe.dst[1] ? 1 : 2);
  const positive = pipe.dst[d] > pipe.src[d];
  const sKey = pipe.src.join(',');
  const dKey = pipe.dst.join(',');
  (touchedFaces[sKey] || (touchedFaces[sKey] = new Set())).add(positive ? FACE_PLUS[d] : FACE_MINUS[d]);
  (touchedFaces[dKey] || (touchedFaces[dKey] = new Set())).add(positive ? FACE_MINUS[d] : FACE_PLUS[d]);
}

// A Y cube is half height and joins the lattice through a single vertical
// pipe. Rather than stretching that pipe to reach the cube's short face, keep
// the pipe at its normal length and slide the Y cube CUBE_SIZE/4 along the
// vertical (three.js y) toward the pipe so its face meets the pipe end.
const ySet = new Set(
  program.cubes.filter(c => c.kind === 'Y').map(c => c.x + ',' + c.y + ',' + c.z)
);
const yShift = {};
for (const pipe of program.pipes) {
  if (pipe.src[2] === pipe.dst[2]) continue;  // only a vertical pipe moves a Y cube
  const sKey = pipe.src.join(','), dKey = pipe.dst.join(',');
  if (ySet.has(sKey)) yShift[sKey] = Math.sign(pipe.dst[2] - pipe.src[2]) * CUBE_SIZE / 4;
  if (ySet.has(dKey)) yShift[dKey] = Math.sign(pipe.src[2] - pipe.dst[2]) * CUBE_SIZE / 4;
}

// Grid (x, y) -> logical qubit index, for hover tooltips. Cells not in this
// map are auxiliary (routing) cells.
const qubitByGrid = {};

const cubeMeshes = [];
const cubesByGate = {};  // gate_index -> [mesh, ...], for hover highlighting

  const isY = cube.kind === 'Y';
  const key = cube.x + ',' + cube.y + ',' + cube.z;
  const touched = touchedFaces[key];
  const surfaceMat = cubeMaterials(cube.kind, touched);
  const mesh = new THREE.Mesh(isY ? yCubeGeom : cubeGeom, surfaceMat);
  mesh.position.copy(toVec(cube.x, cube.y, cube.z));
  if (isY) mesh.position.y += yShift[key] || 0;
  mesh.userData = {
    gx: cube.x, gy: cube.y, gi: cube.gate_index, gt: cube.gate_type,
    gq: cube.qubits, surfaceMat,
  };
  cubeMeshes.push(mesh);
  (cubesByGate[cube.gate_index] || (cubesByGate[cube.gate_index] = [])).push(mesh);
  scene.add(mesh);

  if (drawEdges) {
    const edges = new THREE.LineSegments(isY ? yEdgeGeom : edgeGeom, edgeMaterial);
    edges.position.copy(mesh.position);
    scene.add(edges);
  }

  if (cube.x < minX) minX = cube.x; if (cube.x > maxX) maxX = cube.x;
  if (cube.y < minY) minY = cube.y; if (cube.y > maxY) maxY = cube.y;
  if (cube.z < minZ) minZ = cube.z; if (cube.z > maxZ) maxZ = cube.z;
}

// Base grid: a flat 2-D footprint of the qubit layout, drawn well below the
// z=0 cubes. Grid lines span the width x height patch; logical-qubit cells get
// a teal tile, auxiliary (routing) cells a faint grey one. Tiles are hoverable
// like cubes (see the tooltip handler).
const tileMeshes = [];
const GRID_Y = -CUBE_SIZE / 2 - SPACING;  // vertical level of the layout grid
{
  const W = program.layout.width, H = program.layout.height;
  const gridY = GRID_Y;
  const pts = [];
  for (let i = 0; i <= W; i++)
    pts.push(new THREE.Vector3((i - 0.5) * SPACING, gridY, -0.5 * SPACING),
             new THREE.Vector3((i - 0.5) * SPACING, gridY, (H - 0.5) * SPACING));
  for (let j = 0; j <= H; j++)
    pts.push(new THREE.Vector3(-0.5 * SPACING, gridY, (j - 0.5) * SPACING),
             new THREE.Vector3((W - 0.5) * SPACING, gridY, (j - 0.5) * SPACING));
  scene.add(new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x333333 })));

  const tileGeom = new THREE.PlaneGeometry(SPACING * 0.9, SPACING * 0.9);
  tileGeom.rotateX(-Math.PI / 2);  // lie flat in the x-z (lattice x-y) plane
  const qubitMat = new THREE.MeshBasicMaterial(
    { color: Z_COLOR, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
  const auxMat = new THREE.MeshBasicMaterial(
    { color: 0x555555, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
  const addTile = (x, y, mat) => {
    const t = new THREE.Mesh(tileGeom, mat);
    t.position.set(x * SPACING, gridY, y * SPACING);
    t.userData = { gx: x, gy: y, isTile: true };
    tileMeshes.push(t);
    scene.add(t);
  };

  // "qi" label on each logical-qubit tile, drawn from a canvas texture on a
  // sprite so it always faces the camera and stays upright at any orbit angle.
  function addQubitLabel(x, y, text) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 60px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 64, 64);
    const tex = new THREE.CanvasTexture(canvas);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial(
      { map: tex, transparent: true, depthWrite: false }));
    // Float the label a bit above the tile so its lower half isn't clipped by
    // the tile plane when viewed from above (sprite is ~SPACING*0.7 tall).
    sprite.position.set(x * SPACING, gridY + SPACING * 0.4, y * SPACING);
    sprite.scale.set(SPACING * 0.7, SPACING * 0.7, 1);
    scene.add(sprite);
  }

  for (const [x, y] of program.layout.auxiliaries) addTile(x, y, auxMat);
  program.layout.logical_qubits.forEach(([x, y], i) => {
    addTile(x, y, qubitMat);
    addQubitLabel(x, y, 'q' + i);
  });
}

// four side faces coloured by the boundary types (red=X, blue=Z) of the cube
// it connects and its two end caps (where it meets cubes) left open. Across an
// H pipe the two cubes' types are swapped, so the pipe's colours swap at its

// solid than) the cube faces they attach to.
const pipeMaterial = new THREE.MeshLambertMaterial(
  { color: PIPE_COLOR, transparent: true, opacity: 0.55 });

const sideMatByColor = {};

  const key = color.getHexString();
  return sideMatByColor[key] ||
    (sideMatByColor[key] = new THREE.MeshLambertMaterial(

}
// Solid grey strip marking where an H pipe's colours change (its midpoint).
// polygonOffset keeps it from z-fighting the coplanar pipe faces since it is

const STRIP_COLOR = new THREE.Color(0xC9CBC0);

  { color: STRIP_COLOR, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });

function boxGeom(sx, sy, sz) {
  const key = sx.toFixed(3) + '_' + sy.toFixed(3) + '_' + sz.toFixed(3);
  return boxGeomByDim[key] ||
    (boxGeomByDim[key] = new THREE.BoxGeometry(sx, sy, sz));
}

// Per-lattice-axis colours of a cube kind, or null for the Y/T special kinds.
function axisColorsForKind(kind) {
  if (!kind || kind.length !== 3) return null;
  return [...kind].map(ch => (ch === 'X' ? X_COLOR : Z_COLOR));
}

// BoxGeometry material order [+x,-x,+y,-y,+z,-z]; lattice x->three.js x,
// y->z, z->y. Faces perpendicular to the pipe axis `d` are the open caps; the
// other two axes carry the boundary colours (grey when the cube is Y/T).
const AXIS_TO_MAT_IDX = [[0, 1], [4, 5], [2, 3]];
function pipeMaterialsFor(d, colors) {
  const colourAt = a => (colors && colors[a]) ? sideMaterial(colors[a]) : pipeMaterial;
  const mats = new Array(6);
  for (let a = 0; a < 3; a++) {
    const [i, j] = AXIS_TO_MAT_IDX[a];
    const m = (a === d) ? capMaterial : colourAt(a);
    mats[i] = m; mats[j] = m;
  }
  return mats;
}

// Logical view: pipes are one constant colour (still open-capped). Cached by
// pipe axis since only the cap positions differ.
const LOGICAL_PIPE_SIDE = new THREE.MeshLambertMaterial(
  { color: 0x808890, transparent: true, opacity: 0.55 });
const logicalPipeMatByAxis = {};
function logicalPipeMaterials(d) {
  let mats = logicalPipeMatByAxis[d];
  if (!mats) {
    mats = new Array(6);
    for (let a = 0; a < 3; a++) {
      const [i, j] = AXIS_TO_MAT_IDX[a];
      const m = (a === d) ? capMaterial : LOGICAL_PIPE_SIDE;
      mats[i] = m; mats[j] = m;
    }
    logicalPipeMatByAxis[d] = mats;
  }
  return mats;
}

// three.js box geometry for a lattice-axis-aligned pipe (cube-sized cross
// section) of the given length along axis `d`.
function pipeBoxGeom(d, length) {
  const s = a => (a === d ? length : CUBE_SIZE);
  return boxGeom(s(0), s(2), s(1));
}

const pipeMeshes = [];
const stripMeshes = [];
function addPipeSegment(center, d, length, colors) {
  const surfaceMat = pipeMaterialsFor(d, colors);
  const mesh = new THREE.Mesh(pipeBoxGeom(d, length), surfaceMat);
  mesh.position.copy(center);
  mesh.userData = { d, surfaceMat };
  pipeMeshes.push(mesh);
  scene.add(mesh);
}

// A thin strip wrapping the pipe at `center`, marking the H colour swap.
function addHadamardStrip(center, d) {
  const s = a => (a === d ? STRIP_THICK : STRIP_CROSS);
  const strip = new THREE.Mesh(boxGeom(s(0), s(2), s(1)), stripMaterial);
  strip.position.copy(center);
  stripMeshes.push(strip);
  scene.add(strip);
}

for (const pipe of program.pipes) {
  const [sx, sy, sz] = pipe.src;
  const [dx, dy, dz] = pipe.dst;
  const start = toVec(sx, sy, sz);
  const end = toVec(dx, dy, dz);
  const dir = end.clone().sub(start);
  const length = dir.length();
  if (length === 0) continue;
  // Trim each end back by a cube half-size so the pipe meets the cube surface.
  // Y cubes are half height but are slid toward the pipe (see yShift) so this
  // uniform trim still lands on their face.
  const axis = sx !== dx ? 0 : (sy !== dy ? 1 : 2);
  const unit = dir.clone().normalize();
  const from = start.clone().addScaledVector(unit, CUBE_SIZE / 2);
  const to = end.clone().addScaledVector(unit, -CUBE_SIZE / 2);
  const usable = Math.max(from.distanceTo(to), 0.01);
  const mid = from.clone().add(to).multiplyScalar(0.5);

  const srcColors = axisColorsForKind(pipe.src_kind);
  const dstColors = axisColorsForKind(pipe.dst_kind);
  if (pipe.hadamard) {
    // Two segments: the src half keeps the src cube's colours, the dst half
    // the (swapped) dst colours, so the pipe's colours flip at the midpoint.
    const seg = usable / 2;
    addPipeSegment(mid.clone().addScaledVector(unit, -usable / 4), axis, seg, srcColors);
    addPipeSegment(mid.clone().addScaledVector(unit, usable / 4), axis, seg, dstColors);
    addHadamardStrip(mid, axis);
  } else {
    addPipeSegment(mid, axis, usable, srcColors || dstColors);
  }
}

// Camera framing. Both button poses share one 3/4 view angle and distance
// formula, so for a short circuit "View all" and "View layout grid" coincide;
// they only diverge once the graph grows tall above the grid.
const hasCubes = program.cubes.length > 0;
const W = program.layout.width, H = program.layout.height;

// World-space bounding box of the whole scene (graph cubes + layout grid).
const wMinX = Math.min((hasCubes ? minX : 0) * SPACING, -0.5 * SPACING);
const wMaxX = Math.max((hasCubes ? maxX : W - 1) * SPACING, (W - 0.5) * SPACING);
const wMinZ = Math.min((hasCubes ? minY : 0) * SPACING, -0.5 * SPACING);
const wMaxZ = Math.max((hasCubes ? maxY : H - 1) * SPACING, (H - 0.5) * SPACING);
const wMinY = GRID_Y;                          // grid sits at the bottom
const wMaxY = (hasCubes ? maxZ : 0) * SPACING; // top of the graph

const CAM_ANGLE = new THREE.Vector3(1, 0.8, 1);  // default 3/4 direction
const CAM_FACTOR = 2.5;                           // per-axis offset = radius*factor
function poseFrom(target, radius) {
  const d = Math.max(radius * CAM_FACTOR, 6);
  return {
    pos: target.clone().addScaledVector(CAM_ANGLE, d),
    target: target.clone(),
  };
}

// "View all": frame the entire scene.
const allTarget = new THREE.Vector3(
  (wMinX + wMaxX) / 2, (wMinY + wMaxY) / 2, (wMinZ + wMaxZ) / 2);
const allRadius = Math.max(wMaxX - wMinX, wMaxY - wMinY, wMaxZ - wMinZ, 1) / 2;
const allPose = poseFrom(allTarget, allRadius);

// "View layout grid": frame the 2-D footprint. The target is raised above the
// grid so the grid sits a bit below centre (using the empty space above it).
// For a flat circuit this target/radius match "View all", so the views agree.
const footprintRadius = Math.max(W, H, 1) * SPACING / 2;
const gridTarget = new THREE.Vector3(
  (W - 1) / 2 * SPACING, GRID_Y / 2 + SPACING * 1.3, (H - 1) / 2 * SPACING);
const gridPose = poseFrom(gridTarget, footprintRadius * 1.25);

// Near/far sized to the larger pose so nothing clips.
const near = Math.max(allRadius * 0.002, 0.1);
const far = Math.max(allRadius * 200, 20000);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, near, far);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function moveCamera(pose) {
  camera.position.copy(pose.pos);
  controls.target.copy(pose.target);
  controls.update();
}
document.getElementById('btn-reset').addEventListener('click', () => moveCamera(allPose));
document.getElementById('btn-layout').addEventListener('click', () => moveCamera(gridPose));

// Layout-grid view is the default when the page opens.
moveCamera(gridPose);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Per-gate-type legend for logical view: one row per colour group (types that
// share a colour, e.g. T / TDG, are shown together).
{
  const list = document.getElementById('legend-logical-list');
  const groups = {};
  for (const c of program.cubes)
    (groups[colorKey(c.gate_type)] || (groups[colorKey(c.gate_type)] = new Set())).add(c.gate_type);
  Object.keys(groups).sort().forEach(k => {
    const label = [...groups[k]].sort().map(gt => gt.toUpperCase()).join(' / ');
    const color = '#' + logicalCubeMaterial(k).color.getHexString();
    const row = document.createElement('div');
    row.className = 'leg';
    row.innerHTML = '<div class="leg-sw" style="background:' + color + '"></div>' +
      '<div class="leg-lbl">' + label + '</div>';
    list.appendChild(row);
  });
}

// View toggle. Surface-code view (default) colours cubes/pipes by their X/Z
// boundary types. Logical view colours each cube by the gate it belongs to,
// draws pipes in one constant colour, and drops the H swap strips.
function setView(mode) {
  const logical = mode === 'logical';
  for (const m of cubeMeshes)
    m.material = logical ? logicalCubeMaterial(m.userData.gt) : m.userData.surfaceMat;
  for (const p of pipeMeshes)
    p.material = logical ? logicalPipeMaterials(p.userData.d) : p.userData.surfaceMat;
  for (const s of stripMeshes) s.visible = !logical;
  document.getElementById('legend').style.display = logical ? 'none' : '';
  document.getElementById('legend-logical').style.display = logical ? '' : 'none';
  document.getElementById('btn-surface').classList.toggle('active', !logical);
  document.getElementById('btn-logical').classList.toggle('active', logical);
}
document.getElementById('btn-surface').addEventListener('click', () => setView('surface'));
document.getElementById('btn-logical').addEventListener('click', () => setView('logical'));

// Hover tooltip: raycast the cubes and describe the one under the cursor, and
// light up every cube of the same gate with an additive glow shell.
const tooltip = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function cubeLabel(gx, gy) {
  const qi = qubitByGrid[gx + ',' + gy];
  return qi !== undefined
    ? 'Qubit q' + qi
    : 'Auxiliary at (' + gx + ', ' + gy + ')';
}

const highlightGroup = new THREE.Group();
scene.add(highlightGroup);
const highlightMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.28,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
let highlightedGate = null;
function highlightGate(gi) {
  if (gi === highlightedGate) return;
  highlightedGate = gi;
  highlightGroup.clear();
  if (gi === null) return;
  for (const m of (cubesByGate[gi] || [])) {
    const shell = new THREE.Mesh(m.geometry, highlightMaterial);
    shell.position.copy(m.position);
    shell.scale.setScalar(1.14);
    highlightGroup.add(shell);
  }
}

const hoverTargets = cubeMeshes.concat(tileMeshes);
renderer.domElement.addEventListener('pointermove', (event) => {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hoverTargets, false)[0];
  if (hit) {
    const { gx, gy, gi, gt, gq, isTile } = hit.object.userData;
    // Layout-grid tiles describe the qubit only; cubes also name their gate,
    // labelled by the qubits it acts on, e.g. "T q0" or "CX q0, q1".
    const gateLabel = gt.toUpperCase() +
      (gq && gq.length ? ' ' + gq.map(q => 'q' + q).join(', ') : '');
    tooltip.innerHTML = isTile
      ? cubeLabel(gx, gy)
      : 'Gate: ' + gateLabel +
        '<br><span style="color:#888">' + cubeLabel(gx, gy) + '</span>';
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
    highlightGate(isTile ? null : gi);
  } else {
    tooltip.style.display = 'none';
    highlightGate(null);
  }
});
renderer.domElement.addEventListener('pointerleave', () => {
  tooltip.style.display = 'none';
  highlightGate(null);
});

// HUD population.
document.getElementById('info-qubits').textContent = program.stats.qubit_count;
document.getElementById('info-nodes').textContent = program.cubes.length;
document.getElementById('info-layout').textContent =
  program.layout.width + ' x ' + program.layout.height;
const gatesEl = document.getElementById('info-gates');
const entries = Object.entries(program.stats.nodes_by_gate).sort();
if (!entries.length) {
  gatesEl.textContent = '(none)';
} else {
  gatesEl.innerHTML = entries
    .map(([g, n]) => '<span style="color:#ccc">' + g + '</span>: ' + n)
    .join(' &nbsp; ');
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
